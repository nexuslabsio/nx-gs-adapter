# L2NX game-server adapter config
# Loaded by app.l2nx.gs.adapter.core.config.ConfigResolver
# Resolution order: this file → -D<key> JVM system property → built-in default
#
# ─── Core ────────────────────────────────────────────────────────────────────
#
# Master switch. false = adapter stays DISABLED: no /connect, no heartbeat,
# no CDC. Useful to ship the JAR to an environment without breaking anything
# until credentials are ready.
# Default: false
l2nx.enabled=true
#
# Server key issued by the platform (Game Servers → API Key).
# Must start with "nx_sk_" and be exactly 38 characters.
l2nx.gs-key=nx_sk_
#
# Base URL of the L2NX platform. Must be HTTPS, no trailing slash,
# no path/query/fragment. The adapter appends its own API paths.
l2nx.platform-url=https://<tenant>.api.l2nx.app
#
# ─── Database (optional) ──────────────────────────────────────────────────────
#
# If the host game-core JAR exposes JdbcConnectionSource via ServiceLoader SPI,
# the adapter borrows from the existing pool — leave everything below commented.
#
# Uncomment only when running the adapter standalone (no host SPI registered),
# e.g. for testing or a custom deployment without source access.
# DB credentials stay on this machine — the platform never sees them.
#
# Default: not set (SPI mode)
#l2nx.db.url=jdbc:mariadb://localhost:3306/l2j_db
#l2nx.db.username=l2j_ro
#l2nx.db.password=
#
# Pool size for the adapter-owned connection pool.
# Raise only if you see "No available connection" warnings under high CDC load.
# Default: 4
#l2nx.db.pool-size=4
#
# ─── Kafka producer tuning ───────────────────────────────────────────────────
#
# Batch size in bytes. Producer accumulates records in memory until the batch
# reaches this size, then sends them in one network request.
# Lower → more round-trips to the broker, higher latency on ack callbacks.
# Higher → fewer round-trips, faster throughput on bulk syncs (initial load).
# Default (Kafka): 16384 (16 KB)
l2nx.kafka.producer.batch.size=65536
#
# Delay in milliseconds the producer waits before sending an incomplete batch.
# linger.ms=0 means "send immediately" — every record is its own request unless
# another record arrives in the same millisecond. 20 lets batches fill up and
# cuts round-trips significantly on high-volume initial syncs without
# meaningfully increasing steady-state latency. Drop to 0 if you need lowest
# possible publish latency at the cost of throughput.
# Default (Kafka): 0
l2nx.kafka.producer.linger.ms=20
#
# Compression algorithm applied to each batch before sending to the broker.
# The broker stores the compressed batch as-is; consumers decompress
# transparently via the kafka-clients library.
# gzip — built into the JDK, no extra dependencies, good ratio (~5-10x for JSON).
# lz4 / snappy / zstd — faster CPU but require native libs excluded by default;
#   add the corresponding JAR to the classpath before enabling.
# Higher compression → less network traffic, less broker disk, slower CPU.
# Default (Kafka): none
l2nx.kafka.producer.compression.type=gzip
#
# ─── CDC engine (db-sync module) ─────────────────────────────────────────────
#
# How often the CDC engine polls the database for changes, in seconds.
# Lower → changes appear in Kafka sooner, but more DB load.
# Higher → less DB pressure, acceptable for non-real-time analytics use cases.
# Default: 60
l2nx.cdc-engine.tick-interval-seconds=60
#
# Maximum rows fetched from DB in a single query window per cycle.
# Lower → each query is cheaper, but a large initial sync takes more cycles.
# Higher → initial sync finishes faster, but query holds a read lock longer
#          and uses more heap (each row is CRC-hashed in memory before publish).
# Default: 500000
l2nx.cdc-engine.rows-per-window=500000
#
# JDBC query timeout per window, in seconds. If a single window query exceeds
# this, it is aborted and the cycle is retried on the next tick.
# Raise if you see timeout errors on large tables with a slow disk.
# Default: 10
l2nx.cdc-engine.query-timeout-seconds=10
#
# How long (seconds) the engine waits for Kafka producer callbacks at the end
# of each cycle before declaring remaining publishes as "pending" and replaying
# them next cycle. Does NOT affect whether messages reach Kafka — they are
# already in the producer buffer. Only affects CRC snapshot commit granularity:
# unacked PKs are not written to the snapshot, so they will be re-published
# next cycle (at-least-once delivery).
# Raise if you see "publishes still pending" warnings on large tables or
# a high-latency broker connection.
# Default: 5
l2nx.cdc-engine.publish-flush-seconds=20
#
# Shared CDC engine pool size — the engine schedules per-entity cycles onto a
# bounded daemon pool (nx-cdc-pool-<schema>-N) instead of spawning one thread
# per entity. Sized so a handful of large entities can run concurrently without
# saturating the CPU on small hosts.
# Default: max(2, min(entities, cores/2))
#l2nx.cdc-engine.workers=4
#
# JDBC fetch-size hint per window — `Statement.setFetchSize(n)`. Dialect is
# auto-detected from the connection URL: MySQL/MariaDB → `Integer.MIN_VALUE`
# streaming (the only mode MySQL Connector/J honors for large result sets,
# so this value is ignored on MySQL/MariaDB); Postgres / other drivers →
# this value as a cursor-batch hint.
# Default: 10000
#l2nx.cdc-engine.fetch-size=10000
#
# ─── Runtime sync engine (runtime-sync module) ───────────────────────────────
#
# How often the runtime engine polls in-memory game-server stores, in seconds.
# Volatile state (HP/MP/CP, coordinates, vitality) is read from JVM heap and
# diffed against the previous tick — short ticks surface state change quickly.
# Default: 10
l2nx.runtime-sync.tick-interval-seconds=10
#
# How long (seconds) the engine waits for Kafka producer callbacks at the end
# of each tick before treating unacked PKs as "pending" and replaying them on
# the next tick. Independent of l2nx.cdc-engine.publish-flush-seconds because
# the two engines have different tick cadences (10s vs 60s).
# Default: 5
l2nx.runtime-sync.publish-flush-seconds=5
#
# Shared runtime-sync engine pool size — same formula as cdc-engine.workers,
# scheduled as tasks onto nx-runtime-sync-pool-N daemon threads instead of
# thread-per-entity.
# Default: max(2, min(entities, cores/2))
#l2nx.runtime-sync.workers=4
#
# ─── Adapter IO pool (shared, for handler/module blocking IO) ────────────────
#
# Adapter-owned executor surfaced via ConnectContext.io() (module-level) and
# CommandContext.io() (handler-level). Use this for JDBC / HTTP / any blocking
# IO inside command handlers or modules — running blocking IO on the game
# thread or the Kafka consumer thread is forbidden. Backed by nx-io-N daemon
# threads.
# Default: max(2, cores/2)
#l2nx.io.workers=4
#
# ─── Events publisher (built-in adapter-core capability) ─────────────────────
#
# Outbound discrete-fact fan-out used by host hooks via ctx.events().publishX(...)
# (Phase 1 — premium purchases). One bounded queue, one daemon thread, drop on
# overflow. Sized for game-server cadence — premium events at ~100/min sit
# nowhere near these defaults.
#
# Maximum number of in-flight events queued for the publisher daemon thread
# before the drop policy kicks in. The queue holds a brief burst (e.g. a
# multisell row that grants 5 items + 1 service in one click → 6 events)
# without blocking the game thread.
# Lower → less heap retention, more aggressive drop on burst.
# Higher → smoother burst absorption, more heap if the broker stalls.
# Default: 10000
l2nx.events.queue-capacity=10000
#
# Behavior when the queue is full at enqueue time:
#   newest — drop the incoming envelope; the queue keeps its existing contents.
#            Preserves queue order — the default and recommended choice.
#   oldest — evict the head (oldest envelope) to admit the new one. Available
#            but has a known caveat: under multi-producer contention the
#            dropped-total counter over-counts because the displaced envelope
#            is counted on the eviction path even when concurrent enqueuers
#            race for the same slot. Use only when freshness matters more
#            than completeness and you accept the metric noise.
# Default: newest
l2nx.events.drop-policy=newest
#
# How long (milliseconds) the publisher's daemon thread keeps draining the
# queue after stop() is signalled before giving up and dropping the remainder.
# Adapter shutdown waits for this window so in-flight purchase events reach
# Kafka before the JVM exits. Anything left after the deadline is dropped
# and counted into the heartbeat dropped-total.
# Raise if you see shutdown-time event loss in heartbeat counters.
# Default: 5000
l2nx.events.shutdown-drain-timeout-ms=5000
#
# ─── Commands consumer (built-in adapter-core capability) ────────────────────
#
# Inbound RPC surface — host code registers handlers via
# ctx.commands().on(KickCommand.class, handler) and the adapter dispatches
# Kafka records polled from MessagingTopics.commandsTopic. Replies travel on
# MessagingTopics.commandsRepliesTopic with the inbound Nx-Correlation-Id.
# Single daemon thread, manual offset commit per batch (handlers must be
# idempotent — Kafka redelivers uncommitted batches on JVM restart).
#
# How long (milliseconds) the consumer thread blocks on each KafkaConsumer.poll()
# call. Lower → faster shutdown response, more poll round-trips when idle.
# Higher → fewer wakeups under low load, but stop() takes longer to interrupt.
# Default: 100
l2nx.commands.poll-timeout-ms=100
#
# How long (milliseconds) the consumer thread waits for in-flight handlers to
# complete after stop() is signalled. Adapter shutdown waits for this window
# so a handler hopping to the host executor finishes its game-state mutation
# before the JVM exits. Records still in the current batch but not yet
# dispatched at the deadline get redelivered on next start.
# Raise if you see truncated handlers in shutdown logs.
# Default: 5000
l2nx.commands.shutdown-timeout-ms=5000
#
# Bound (milliseconds) on ctx.host().sync(...) — handlers blocking on the
# host's game-thread pool will throw HostExecutorTimeoutException after this
# window, which the dispatcher maps to CommandResult.error(UNAVAILABLE).
# Load-bearing safety: an unbounded await would let a saturated host pool
# wedge the consumer thread indefinitely, eventually triggering Kafka
# session-timeout + partition reassignment storm.
# Lower → faster failure detection on host pool saturation, more spurious
#         timeouts on legitimately-slow operations.
# Higher → tolerates slow operations, slower detection of wedged pool.
# Default: 30000
l2nx.commands.host-sync-timeout-ms=30000
#
# Bound (milliseconds) on the per-batch reply-flush wait between handler
# completion and Kafka offset commit. Replies are sent async via the Kafka
# producer; the dispatcher waits up to this window for all in-flight
# callbacks to fire before advancing the consumer offset. Closes the
# at-most-once reply window: a JVM crash before the flush completes leaves
# the batch uncommitted, so records redeliver and replies are re-emitted by
# the (idempotent) handlers.
# Set to 0 to opt out — replies become at-most-once on JVM crash.
# Default: 5000
l2nx.commands.reply-flush-timeout-ms=5000
#
# Per-property overrides for the underlying Kafka consumer. Anything matching
# l2nx.commands.kafka.<kafka-property-name> is forwarded to the KafkaConsumer
# config map (security.protocol, sasl.*, bootstrap.servers, group.id, client.id,
# enable.auto.commit are pinned by the adapter and cannot be overridden).
#
# Most operators leave these alone. Tune only when measurements demand it.
#
# Maximum records per poll iteration — caps batch commit granularity. Lower
# values reduce redelivery blast radius on JVM crash; higher values smooth
# throughput under bursty load.
# Default: 50
l2nx.commands.kafka.max.poll.records=50
