# L2NX game-server adapter config
# Loaded by app.l2nx.gs.adapter.core.config.ConfigResolver
# Resolution order: this file -> -D<key> JVM system property -> built-in default

# Master switch. false = adapter stays disabled: no /connect, no heartbeat, no CDC.
# Default: false
l2nx.enabled=true

# Server key issued by the platform (Game Servers -> API Key).
# Must start with "nx_sk_" and be exactly 38 characters.
l2nx.gs-key=nx_sk_

# Base URL of the L2NX platform. HTTPS, no trailing slash, no path/query/fragment.
l2nx.platform-url=https://<tenant>.api.l2nx.app

# Database (optional)
# If the host game-core JAR exposes JdbcConnectionSource via ServiceLoader SPI, the adapter
# borrows from the existing pool - leave these commented. Set only when running standalone.
# DB credentials stay on this machine - the platform never sees them.
# Default: not set (SPI mode)
#l2nx.db.url=jdbc:mariadb://localhost:3306/l2j_db
#l2nx.db.username=l2j_ro
#l2nx.db.password=

# Pool size for the adapter-owned connection pool.
# Raise only on "No available connection" warnings under high CDC load.
# Default: 4
#l2nx.db.pool-size=4

# Kafka producer tuning

# Batch size in bytes. Higher = fewer round-trips and faster bulk syncs; lower = lower ack latency.
# Default (Kafka): 16384
l2nx.kafka.producer.batch.size=65536

# Delay in ms before sending an incomplete batch. 20 cuts round-trips on high-volume initial
# syncs; 0 gives the lowest publish latency at the cost of throughput.
# Default (Kafka): 0
l2nx.kafka.producer.linger.ms=20

# Batch compression. gzip needs no extra JARs; lz4 / snappy / zstd are faster but need their
# native-lib JAR on the classpath.
# Default (Kafka): none
l2nx.kafka.producer.compression.type=gzip

# CDC engine (db-sync module)

# Seconds between DB polls. Lower = fresher data, more DB load.
# Default: 60
l2nx.cdc-engine.tick-interval-seconds=60

# Max rows fetched per query window. Higher = faster initial sync, but longer read lock and
# more heap (every row is CRC-hashed in memory before publish).
# Default: 500000
l2nx.cdc-engine.rows-per-window=500000

# JDBC query timeout per window, in seconds. A timed-out window is aborted and retried next tick.
# Raise on large tables with slow disks.
# Default: 10
l2nx.cdc-engine.query-timeout-seconds=10

# Seconds to wait for Kafka producer callbacks at the end of each cycle. Unacked PKs are left
# out of the CRC snapshot and re-published next cycle (at-least-once).
# Raise on "publishes still pending" warnings.
# Default: 5
l2nx.cdc-engine.publish-flush-seconds=20

# Shared CDC pool size (nx-cdc-pool-<schema>-N daemon threads, not thread-per-entity).
# Default: max(2, min(entities, cores/2))
#l2nx.cdc-engine.workers=4

# JDBC fetch-size hint per window. Ignored on MySQL/MariaDB (streaming via Integer.MIN_VALUE,
# the only mode Connector/J honors for large result sets); other drivers use it as a cursor batch.
# Default: 10000
#l2nx.cdc-engine.fetch-size=10000

# Runtime sync engine (runtime-sync module)

# Seconds between polls of in-memory game-server state (HP/MP/CP, coordinates, vitality),
# diffed against the previous tick.
# Default: 10
l2nx.runtime-sync.tick-interval-seconds=10

# Same as cdc-engine.publish-flush-seconds, per tick; separate because the cadences differ.
# Default: 5
l2nx.runtime-sync.publish-flush-seconds=5

# Shared runtime-sync pool size (nx-runtime-sync-pool-N daemon threads), same formula as cdc-engine.workers.
# Default: max(2, min(entities, cores/2))
#l2nx.runtime-sync.workers=4

# Adapter IO pool

# Executor behind ConnectContext.io() and CommandContext.io(), for JDBC / HTTP / any blocking IO
# in handlers and modules. Blocking IO on the game thread or Kafka consumer thread is forbidden.
# Backed by nx-io-N daemon threads.
# Default: max(2, cores/2)
#l2nx.io.workers=4

# Events publisher

# Outbound events from host hooks via ctx.events().publishX(...). One bounded queue and one
# daemon thread; events are dropped on overflow.

# Max queued events before the drop policy applies. Lower = less heap, more drops on bursts;
# higher = smoother bursts, more heap if the broker stalls.
# Default: 10000
l2nx.events.queue-capacity=10000

# Behavior when the queue is full:
#   newest - drop the incoming envelope; preserves queue order (recommended)
#   oldest - evict the head to admit the new one; under multi-producer contention the
#            dropped-total counter over-counts. Use only when freshness beats completeness.
# Default: newest
l2nx.events.drop-policy=newest

# Ms the publisher thread keeps draining after stop() before dropping the remainder (counted in
# the heartbeat dropped-total). Shutdown waits this long so in-flight events reach Kafka.
# Raise on shutdown-time event loss.
# Default: 5000
l2nx.events.shutdown-drain-timeout-ms=5000

# Commands consumer

# Inbound RPC: handlers registered via ctx.commands().on(...) are dispatched from the commands
# topic; replies go to the replies topic with the inbound Nx-Correlation-Id. Single daemon
# thread, manual offset commit per batch - handlers must be idempotent (uncommitted batches
# are redelivered after a restart).

# Ms each KafkaConsumer.poll() blocks. Lower = faster shutdown, more idle wakeups.
# Default: 100
l2nx.commands.poll-timeout-ms=100

# Ms to wait for in-flight handlers after stop(). Records not yet dispatched at the deadline
# are redelivered on next start.
# Raise on truncated handlers in shutdown logs.
# Default: 5000
l2nx.commands.shutdown-timeout-ms=5000

# Bound in ms on ctx.host().sync(...). On expiry the handler gets HostExecutorTimeoutException,
# mapped to CommandResult.error(UNAVAILABLE). Must stay bounded: a saturated host pool would
# otherwise wedge the consumer thread and trigger Kafka session timeout and rebalance.
# Default: 30000
l2nx.commands.host-sync-timeout-ms=30000

# Bound in ms on a deferred reply: a handler that took ctx.deferReply() and never completed it
# gets an INTERNAL_ERROR reply. Must exceed the longest legitimate deferred command on this host.
# Default: 300000
l2nx.commands.deferred-reply-max-ms=300000

# Overrides for the underlying Kafka consumer: l2nx.commands.kafka.<kafka-property-name> is
# forwarded as-is, except security.protocol, sasl.*, bootstrap.servers, group.id, client.id and
# enable.auto.commit, which the adapter pins.

# Max records per poll; caps batch commit granularity. Lower = smaller redelivery after a crash.
# Default: 50
l2nx.commands.kafka.max.poll.records=50
