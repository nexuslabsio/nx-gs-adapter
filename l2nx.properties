# L2NX game-server adapter config
# Loaded by app.l2nx.gs.adapter.core.config.ConfigResolver
# Master switch — adapter goes to DISABLED (no /connect, no heartbeat)
# unless this is true. Default: false.
l2nx.enabled=true
# Server key issued by the platform
l2nx.gs-key=nx_sk_
# Platform base URL
l2nx.platform-url=https://<tenant>.api.l2nx.app
# ─── DB fallback (only if no JdbcConnectionSource SPI registered by host) ───
# If your game-core JAR exposes a JdbcConnectionSource implementation via
# META-INF/services, the adapter borrows from your existing pool — leave the
# l2nx.db.* keys below unset. Otherwise (no source-code access to host, or
# you prefer adapter to own a separate pool), uncomment and fill these.
# DB credentials NEVER leave this machine — the platform does not see them.
#l2nx.db.url=jdbc:mariadb://localhost:3306/l2j_db
#l2nx.db.username=l2j_ro
#l2nx.db.password=
#l2nx.db.pool-size=4
# ─── CDC engine tuning (db-sync module) ───
# Each key resolves file-first, then -D<key> sysprop, then default.
# All defaults shipped by the engine are sane for a 12M-row items table.
#l2nx.cdc-engine.tick-interval-seconds=60
#l2nx.cdc-engine.rows-per-window=500000
#l2nx.cdc-engine.query-timeout-seconds=10
#l2nx.cdc-engine.publish-flush-seconds=5